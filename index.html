<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles/style.css">
  <title>Calculadora de Edad</title>
</head>
<body>
  <div class="container">
    <div class="form-container">
      <form id="age-form">
        <div class="input-fields">
          <div class="input-group">
            <label for="day">DAY</label>
            <input type="number" id="day" name="day" min="1" max="31" placeholder="DD">
            <div id="day-error" class="error-message"></div>
          </div>
          <div class="input-group">
            <label for="month">MONTH</label>
            <input type="number" id="month" name="month" min="1" max="12" placeholder="MM">
            <div id="month-error" class="error-message"></div>
          </div>
          <div class="input-group">
            <label for="year">YEAR</label>
            <input type="number" id="year" name="year" placeholder="YYYY">
            <div id="year-error" class="error-message"></div>
          </div>
        </div>
        
        <div class="separator-container">
          <div class="separator"></div>
          <div class="btn-container">
            <button type="submit" id="submit-btn">
              <img src="assets/images/icon-arrow.svg" alt="arrow icon">
            </button>
          </div>
        </div>
      </form>
      
      <div id="error-message"></div>
      
      <div id="age-result" class="age-result">
        <p><span id="years"></span>years</p>
        <p><span id="months"></span>months</p>
        <p><span id="days"></span>days</p>
      </div>
    </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/ALEJOPLAYEX/Calculadora-edad">ALEJOPLAYEX-DEV</a>.
  </footer>

  <script src="scripts/script.js"></script>
</body>
</html>
